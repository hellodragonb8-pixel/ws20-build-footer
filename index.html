<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft Footer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-content" aria-label="Page content"></main>

    <footer class="site-footer">
      <div class="footer-top">
        <a class="brand-icon" href="https://www.microsoft.com/" aria-label="Microsoft">
          <span class="microsoft-glyph" aria-hidden="true"></span>
        </a>

        <nav aria-label="Microsoft channels">
          <ul class="channel-list">
            <li><a class="channel-icon" href="https://github.com/microsoft" aria-label="GitHub"><span class="github-glyph" aria-hidden="true"></span></a></li>
            <li><a class="channel-icon" href="https://x.com/Microsoft" aria-label="X, formerly Twitter"><span class="x-glyph" aria-hidden="true"></span></a></li>
            <li><a class="channel-icon" href="https://www.linkedin.com/company/microsoft/" aria-label="LinkedIn"><span class="linkedin-glyph" aria-hidden="true"></span></a></li>
            <li><a class="channel-icon" href="https://bsky.app/profile/microsoft.com" aria-label="Bluesky"><span class="bluesky-glyph" aria-hidden="true"></span></a></li>
            <li><a class="channel-icon" href="https://www.reddit.com/r/microsoft/" aria-label="Reddit"><span class="reddit-glyph" aria-hidden="true"></span></a></li>
            <li><a class="channel-icon" href="#" aria-label="VS Code Insiders podcast"><span class="microphone-glyph" aria-hidden="true"></span></a></li>
            <li><a class="channel-icon" href="https://www.tiktok.com/@microsoft" aria-label="TikTok"><span class="tiktok-glyph" aria-hidden="true"></span></a></li>
            <li><a class="channel-icon" href="https://www.youtube.com/microsoft" aria-label="YouTube"><span class="youtube-glyph" aria-hidden="true"></span></a></li>
          </ul>
        </nav>
      </div>

      <div class="footer-bottom">
        <nav aria-label="Legal">
          <ul class="legal-list">
            <li class="copyright">&copy; 2026 Microsoft</li>
            <li><a href="https://support.microsoft.com/">Support</a></li>
            <li><a href="https://privacy.microsoft.com/">Privacy</a></li>
            <li><a href="https://www.microsoft.com/servicesagreement/">Terms of Use</a></li>
            <li><a href="#">License</a></li>
          </ul>
        </nav>

        <nav aria-label="Privacy">
          <ul class="privacy-list">
            <li>
              <a class="privacy-choice" href="#">
                <span class="privacy-choice-icon" aria-hidden="true"></span>
                <span>Your privacy Choices</span>
              </a>
            </li>
            <li><a href="#">Consumer Health Privacy</a></li>
          </ul>
        </nav>
      </div>
    </footer>
  </body>
</html>
